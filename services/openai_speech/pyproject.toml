[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmas-openai-speech"
version = "0.2.0"
description = "OpenAI-compatible REST and Realtime services for public NVIDIA ASR and TTS models"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.115",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
asr = [
    "accelerate>=1.0",
    "librosa>=0.11",
    "torch>=2.6",
    "transformers>=5.13.0",
]
tts = [
    "huggingface-hub>=0.30",
    "kaldialign",
    "nemo-toolkit[tts]",
    "torch>=2.6",
]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
